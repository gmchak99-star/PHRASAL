<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실전 구동사 청크 트레이너</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151e32;
      --card-border: #233554;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
      
      /* 청크 컬러 테마 */
      --c-subj: #c084fc;   /* 연보라: 주어/시작구 */
      --c-verb: #4ade80;   /* 연초록: 핵심 구동사 */
      --c-obj: #38bdf8;    /* 하늘색: 목적어/보어 */
      --c-mod: #fbbf24;    /* 주황노랑: 수식/전치사구 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 95px;
      max-width: 760px;
      margin: 0 auto;
    }

    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.35rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    p.desc { font-size: 0.8rem; color: var(--text-sub); }

    /* Web AudioContext 오디오 언락 & TTS 초기화 모듈 바 */
    .audio-unlock-bar {
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .audio-unlock-bar span { font-size: 0.82rem; font-weight: 700; color: #bfdbfe; }
    .btn-unlock {
      background: #60a5fa;
      color: #0f172a;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 탭 메뉴 */
    .tab-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* 상단 컨트롤 바 */
    .global-controls {
      background: rgba(21, 30, 50, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .ctrl-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-mode-toggle {
      background: #0d9488;
      border: 1px solid #14b8a6;
      color: #fff;
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-shuffle {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 7px 11px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-seq {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 7px 11px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-emergency-stop {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 7px 11px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* 문장 카드 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .card.playing {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .verb-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .verb-badge {
      background: #0369a1;
      color: #e0f2fe;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 5px;
    }
    .verb-meaning {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .loop-status {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--accent);
    }
    .ko-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    /* 청크 스타일 (색상은 그대로 유지) */
    .en-box {
      background: #090d16;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      user-select: text;
    }
    .en-box.blind .chunk {
      filter: blur(5px);
      user-select: none;
      opacity: 0.3;
    }
    .chunk {
      display: inline-block;
      margin-right: 4px;
      padding: 1px 4px;
      border-radius: 4px;
      transition: background 0.15s, transform 0.15s;
    }
    .chunk.active-spoken {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.04);
      outline: 1px solid var(--accent);
    }
    .chunk-subj { color: var(--c-subj); }
    .chunk-verb { color: var(--c-verb); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
    .chunk-obj  { color: var(--c-obj); }
    .chunk-mod  { color: var(--c-mod); }

    /* 동의어/반의어 태그 박스 */
    .meta-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: rgba(11, 15, 25, 0.6);
      padding: 7px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.75rem;
    }
    .meta-label { font-weight: 700; }
    .meta-label.syn { color: #34d399; }
    .meta-label.ant { color: #f87171; }
    .meta-tag {
      background: #1e293b;
      color: #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .btn-act {
      border: none;
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-blind-toggle { background: #334155; color: #fff; }
    .btn-play-1000 { background: var(--primary); color: #fff; }
    .btn-stop-card { background: #475569; color: #fff; }
    .btn-fav { background: transparent; border: 1px solid #475569; color: #94a3b8; }
    .btn-fav.active { background: #d97706; border-color: #d97706; color: #fff; }

    /* 플로팅 화면끄기 버튼 */
    .floating-lock {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: #090d16;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 10px 14px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* OLED 암전 커튼 */
    #dark-curtain {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000;
      z-index: 99999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      user-select: none;
    }
    #dark-curtain .wake-hint {
      color: #334155;
      font-size: 0.82rem;
      margin-bottom: 24px;
    }
    #dark-curtain .curr-text {
      color: #64748b;
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 12px;
      max-width: 90%;
    }
    #dark-curtain .curr-count {
      color: #1d4ed8;
      font-size: 1.7rem;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔥 실전 구동사 트레이너</h1>
    <p class="desc">색상 청크 어순 체화 | 일반·청크 리듬 토글 | 1,000회 무한 루프</p>
  </header>

  <!-- Web AudioContext 오디오 언락 & TTS 초기화 모듈 -->
  <div class="audio-unlock-bar">
    <span>🔊 깃허브 웹소리가 안 나면 먼저 눌러주세요:</span>
    <button class="btn-unlock" onclick="forceUnlockAudio()">스피커 강제 깨우기</button>
  </div>

  <!-- 탭 네비게이션 -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchCategory('daily')">🏋️ 일상·운동</button>
    <button class="tab-btn" onclick="switchCategory('challenge')">🌊 다이빙·도전</button>
    <button class="tab-btn" onclick="switchCategory('pension')">🏡 펜션·업무</button>
    <button class="tab-btn" onclick="switchCategory('review')">⭐ 복습함 (<span id="rev-cnt">0</span>)</button>
  </div>

  <!-- 상단 제어 바 -->
  <div class="global-controls">
    <div class="ctrl-group">
      <button class="btn-pill" id="g-voice" onclick="toggleGlobalVoice()">👨 남성 음성</button>
      <button class="btn-pill" id="g-speed" onclick="toggleGlobalSpeed()">0.85x (기본)</button>
      <!-- 읽기 모드 토글 버튼 (일반 통문장 / 청크 분할) -->
      <button class="btn-mode-toggle" id="g-reading-mode" onclick="toggleReadingMode()">🗣️ 낭독: 일반 (자연스럽게)</button>
    </div>
    <div class="ctrl-group">
      <button class="btn-shuffle" onclick="shuffleCurrentList()">🔀 셔플 (랜덤)</button>
      <button class="btn-seq" onclick="startSequentialPlay()">🔁 전체 순차</button>
      <button class="btn-emergency-stop" onclick="stopAllAudio()">⏹️ 정지</button>
    </div>
  </div>

  <!-- 카드 렌더링 컨테이너 -->
  <div id="cards-container"></div>

  <!-- 플로팅 OLED 절전 버튼 -->
  <button class="floating-lock" onclick="openOledCurtain()">
    🌙 화면 절전 (암전)
  </button>

  <!-- 완전 암전 절전 커튼 (더블 탭 복귀) -->
  <div id="dark-curtain" onclick="handleCurtainTap()">
    <div class="wake-hint">💡 화면을 빠르게 톡! 톡! 두 번 두드리면 복귀합니다</div>
    <div class="curr-text" id="curtain-text">재생 준비 완료</div>
    <div class="curr-count" id="curtain-count">0 / 1000</div>
  </div>

  <script>
    /* ==========================================================================
       [모듈] Web AudioContext 오디오 언락 & TTS 초기화 모듈
       ========================================================================== */
    let audioCtx = null;
    let audioUnlocked = false;

    function forceUnlockAudio() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          if (!audioCtx) audioCtx = new AudioCtx();
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          gain.gain.value = 0.001;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(0);
          osc.stop(0.05);
        }
      } catch (e) {
        console.warn("AudioContext bypass:", e);
      }

      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      const testUtter = new SpeechSynthesisUtterance("Audio engine ready.");
      testUtter.lang = 'en-US';
      testUtter.rate = 1.0;
      testUtter.volume = 1.0;
      window.speechSynthesis.speak(testUtter);
      audioUnlocked = true;
      alert("🔊 브라우저 스피커가 강제 활성화되었습니다! 문장을 재생해보세요.");
    }

    function ensureAudioUnlocked() {
      if (!audioUnlocked) {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx && !audioCtx) audioCtx = new AudioCtx();
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) {}
      }
    }

            { text: "I will", type: "subj" },
            { text: "take care of", type: "verb" },
            { text: "the BBQ grill setup", type: "obj" },
            { text: "right now.", type: "mod" }
          ],
          ko: "바비큐 그릴 세팅은 제가 지금 바로 준비해 드릴게요.",
          synonyms: ["handle", "manage", "look after", "attend to"],
          antonyms: ["neglect", "ignore", "overlook"]
        },
        {
          verb: "deal with",
          emoji: "📋",
          meaning: "다루다, 처리하다",
          chunks: [
            { text: "I have to", type: "subj" },
            { text: "deal with", type: "verb" },
            { text: "sudden booking changes", type: "obj" },
            { text: "promptly.", type: "mod" }
          ],
          ko: "갑작스러운 예약 변경 요청 건들을 신속하게 처리해야 해.",
          synonyms: ["cope with", "tackle", "handle", "address"],
          antonyms: ["avoid", "shirk", "neglect"]
        },
        {
          verb: "drop off",
          emoji: "🧺",
          meaning: "가져다주다, 내려주다",
          chunks: [
            { text: "Could you", type: "subj" },
            { text: "drop off", type: "verb" },
            { text: "clean towels", type: "obj" },
            { text: "at room two?", type: "mod" }
          ],
          ko: "2호실에 깨끗한 수건 좀 전달해 주실 수 있나요?",
          synonyms: ["deliver", "leave", "hand over"],
          antonyms: ["pick up", "collect", "retrieve"]
        },
        {
          verb: "look after",
          emoji: "🏡",
          meaning: "보살피다, 관리하다",
          chunks: [
            { text: "I carefully", type: "subj" },
            { text: "look after", type: "verb" },
            { text: "every single corner", type: "obj" },
            { text: "of the facility.", type: "mod" }
          ],
          ko: "펜션 시설의 구석구석을 꼼꼼하게 살피고 관리해.",
          synonyms: ["care for", "mind", "watch over", "maintain"],
          antonyms: ["neglect", "ignore", "abandon"]
        }
      ]
    };

    /* ==========================================================================
       앱 상태 및 스마트 TTS 낭독 엔진
       ========================================================================== */
    let curCat = 'daily';
    let reviewStore = JSON.parse(localStorage.getItem('phrasal_reviews_v5') || '[]');
    let currentVoiceGender = 'male';
    let currentRate = 0.85;
    let readingMode = 'normal'; // 'normal' (일반 자연스러운 리듬) vs 'chunk' (청크 분절)
    let isGlobalStopped = false;
    let activeLoopTimer = null;
    const TARGET_REPEAT = 1000;

    function getSelectedVoice() {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      const usVoices = voices.filter(v => v.lang === 'en-US' || v.lang === 'en_US');
      const pool = usVoices.length > 0 ? usVoices : voices.filter(v => v.lang.startsWith('en'));

      if (currentVoiceGender === 'female') {
        return pool.find(v => /female|zira|jenny|samantha|susan|victoria/i.test(v.name)) || pool[0];
      } else {
        return pool.find(v => /male|david|guy|george/i.test(v.name)) || pool.find(v => !/female|zira|jenny/i.test(v.name)) || pool[0];
      }
    }
    window.speechSynthesis.onvoiceschanged = () => { getSelectedVoice(); };

    function sanitizeForSpeech(text) {
      return text.replace(/freediving/gi, "free diving")
                 .replace(/Freediving/gi, "Free diving")
                 .replace(/low-carb/gi, "low carb");
    }

    function getFullSentence(item) {
      return item.chunks.map(c => c.text).join(' ');
    }

    // 낭독 모드 토글 함수
    function toggleReadingMode() {
      const btn = document.getElementById('g-reading-mode');
      if (readingMode === 'normal') {
        readingMode = 'chunk';
        btn.innerText = "✂️ 낭독: 청크 (끊어 읽기)";
        btn.style.background = "#0284c7";
        btn.style.borderColor = "#38bdf8";
      } else {
        readingMode = 'normal';
        btn.innerText = "🗣️ 낭독: 일반 (자연스럽게)";
        btn.style.background = "#0d9488";
        btn.style.borderColor = "#14b8a6";
      }
    }

    // [핵심 엔진] 모드에 따라 일반 통문장 또는 청크 분절로 읽어주는 통합 실행 함수
    function speakAdaptive(item, cardIdx, onComplete) {
      if (readingMode === 'normal') {
        // [일반 모드] 물 흐르듯 통문장으로 자연스럽게 발화
        clearChunkHighlight(cardIdx);
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const fullEn = getFullSentence(item);
        const u = new SpeechSynthesisUtterance(sanitizeForSpeech(fullEn));
        u.lang = 'en-US';
        u.rate = currentRate;
        u.volume = 1.0;
        u.pitch = 1.0;

        const v = getSelectedVoice();
        if (v) u.voice = v;
        window._activeUtterance = u;

        u.onend = () => {
          if (!isGlobalStopped && onComplete) onComplete();
        };
        u.onerror = () => {
          if (!isGlobalStopped && onComplete) onComplete();
        };

        window.speechSynthesis.speak(u);
      } else {
        // [청크 모드] 청크 사이 0.28초 쉬어가며 분절 발화
        let chunkIdx = 0;
        function speakNextChunk() {
          if (isGlobalStopped) return;
          if (chunkIdx >= item.chunks.length) {
            clearChunkHighlight(cardIdx);
            if (onComplete) onComplete();
            return;
          }

          highlightActiveChunk(cardIdx, chunkIdx);
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();

          const chunkObj = item.chunks[chunkIdx];
          const u = new SpeechSynthesisUtterance(sanitizeForSpeech(chunkObj.text));
          u.lang = 'en-US';
          u.rate = currentRate;
          u.volume = 1.0;
          u.pitch = 1.0;

          const v = getSelectedVoice();
          if (v) u.voice = v;
          window._activeUtterance = u;

          u.onend = () => {
            if (isGlobalStopped) return;
            chunkIdx++;
            activeLoopTimer = setTimeout(speakNextChunk, 280);
          };
          u.onerror = () => {
            if (isGlobalStopped) return;
            chunkIdx++;
            activeLoopTimer = setTimeout(speakNextChunk, 200);
          };

          window.speechSynthesis.speak(u);
        }
        speakNextChunk();
      }
    }

    function highlightActiveChunk(cardIdx, chunkIdx) {
      clearChunkHighlight(cardIdx);
      const chunkSpan = document.getElementById(`chunk-${cardIdx}-${chunkIdx}`);
      if (chunkSpan) chunkSpan.classList.add('active-spoken');
    }

    function clearChunkHighlight(cardIdx) {
      const card = document.getElementById(`card-${cardIdx}`);
      if (card) {
        card.querySelectorAll('.chunk').forEach(el => el.classList.remove('active-spoken'));
      }
    }

    // 1,000회 단일 문장 무한 루프
    function play1000Times(itemIdx) {
      ensureAudioUnlocked();
      stopAllAudio();
      isGlobalStopped = false;

      const list = getCurrentList();
      const item = list[itemIdx];
      const fullEn = getFullSentence(item);

      document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
      const activeCard = document.getElementById(`card-${itemIdx}`);
      if (activeCard) activeCard.classList.add('playing');

      const statusEl = document.getElementById(`status-${itemIdx}`);
      const curtainText = document.getElementById('curtain-text');
      const curtainCount = document.getElementById('curtain-count');

      curtainText.innerText = fullEn;
      let count = 0;

      function runLoop() {
        if (isGlobalStopped || count >= TARGET_REPEAT) {
          if (statusEl && !isGlobalStopped) statusEl.innerText = "1,000회 완주!";
          return;
        }

        count++;
        if (statusEl) statusEl.innerText = `${count} / ${TARGET_REPEAT}`;
        curtainCount.innerText = `${count} / ${TARGET_REPEAT}`;

        speakAdaptive(item, itemIdx, () => {
          if (!isGlobalStopped && count < TARGET_REPEAT) {
            // 일반 모드는 0.7초, 청크 모드는 0.85초 정적 섀도잉 간격
            const pauseGap = (readingMode === 'normal') ? 700 : 850;
            activeLoopTimer = setTimeout(runLoop, pauseGap);
          }
        });
      }

      runLoop();
    }

    // 전체 순차 반복 모드
    function startSequentialPlay() {
      ensureAudioUnlocked();
      stopAllAudio();
      isGlobalStopped = false;
      const list = getCurrentList();
      if (list.length === 0) return;

      let idx = 0;
      function playNextSentence() {
        if (isGlobalStopped) return;
        if (idx >= list.length) idx = 0;

        const item = list[idx];
        const fullEn = getFullSentence(item);

        document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
        const activeCard = document.getElementById(`card-${idx}`);
        if (activeCard) activeCard.classList.add('playing');

        const statusEl = document.getElementById(`status-${idx}`);
        if (statusEl) statusEl.innerText = "순차 반복 중...";

        document.getElementById('curtain-text').innerText = fullEn;
        document.getElementById('curtain-count').innerText = `문장 ${idx + 1} / ${list.length}`;

        speakAdaptive(item, idx, () => {
          if (!isGlobalStopped) {
            idx++;
            activeLoopTimer = setTimeout(playNextSentence, 800);
          }
        });
      }

      playNextSentence();
    }

    // 긴급 정지
    function stopAllAudio() {
      isGlobalStopped = true;
      clearTimeout(activeLoopTimer);
      window.speechSynthesis.cancel();
      document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
      document.querySelectorAll('.loop-status').forEach(s => s.innerText = "");
      document.querySelectorAll('.chunk').forEach(el => el.classList.remove('active-spoken'));
    }

    /* ==========================================================================
       렌더링 및 UI 조작
       ========================================================================== */
    function getCurrentList() {
      return (curCat === 'review') ? reviewStore : phrasalDB[curCat];
    }

    function shuffleCurrentList() {
      stopAllAudio();
      const list = getCurrentList();
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = "";
      const list = getCurrentList();

      document.getElementById('rev-cnt').innerText = reviewStore.length;

      if (list.length === 0 && curCat === 'review') {
        container.innerHTML = `<div style="text-align:center; padding:45px 12px; color:#64748b; font-size:0.9rem;">
          아직 복습함에 담긴 문장이 없습니다.<br>다른 탭에서 [⭐ 복습 담기]를 눌러보세요.
        </div>`;
        return;
      }

      list.forEach((item, idx) => {
        const fullEn = getFullSentence(item);
        const isFav = reviewStore.some(r => getFullSentence(r) === fullEn);

        // 시각적 청크 span (색상 표시는 항상 유지됨)
        const chunksHtml = item.chunks.map((c, cIdx) => {
          return `<span class="chunk chunk-${c.type}" id="chunk-${idx}-${cIdx}">${c.text}</span>`;
        }).join(' ');

        const synTags = (item.synonyms || []).map(s => `<span class="meta-tag">${s}</span>`).join('');
        const antTags = (item.antonyms || []).map(a => `<span class="meta-tag">${a}</span>`).join('');

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${idx}`;
        card.innerHTML = `
          <div class="card-head">
            <div class="verb-title">
              <span style="font-size:1.15rem;">${item.emoji || '📌'}</span>
              <span class="verb-badge">${item.verb}</span>
              <span class="verb-meaning">${item.meaning}</span>
            </div>
            <span class="loop-status" id="status-${idx}"></span>
          </div>

          <div class="ko-text">${item.ko}</div>

          <div class="en-box blind" id="en-${idx}">
            ${chunksHtml}
          </div>

          <div class="meta-box">
            <span class="meta-label syn">유사:</span> ${synTags}
            <span class="meta-label ant" style="margin-left:6px;">반대:</span> ${antTags}
          </div>

          <div class="card-actions">
            <button class="btn-act btn-fav ${isFav ? 'active' : ''}" onclick="toggleReview(${idx})">${isFav ? '★ 복습 중' : '⭐ 복습 담기'}</button>
            <button class="btn-act btn-blind-toggle" onclick="toggleBlind(${idx})">👁️ 가림 해제</button>
            <button class="btn-act btn-play-1000" onclick="play1000Times(${idx})">▶ 1000회 반복</button>
            <button class="btn-act btn-stop-card" onclick="stopAllAudio()">⏹️ 정지</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleBlind(idx) {
      const enEl = document.getElementById(`en-${idx}`);
      const btn = event.currentTarget;
      if (enEl.classList.contains('blind')) {
        enEl.classList.remove('blind');
        btn.innerText = "🙈 가리기";
      } else {
        enEl.classList.add('blind');
        btn.innerText = "👁️ 가림 해제";
      }
    }

    function toggleReview(idx) {
      const list = getCurrentList();
      const target = list[idx];
      const targetEn = getFullSentence(target);
      const foundIdx = reviewStore.findIndex(r => getFullSentence(r) === targetEn);

      if (foundIdx > -1) {
        reviewStore.splice(foundIdx, 1);
      } else {
        reviewStore.push(target);
      }
      localStorage.setItem('phrasal_reviews_v5', JSON.stringify(reviewStore));
      renderCards();
    }

    function switchCategory(cat) {
      stopAllAudio();
      curCat = cat;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', ['daily', 'challenge', 'pension', 'review'][i] === cat);
      });
      renderCards();
    }

    function toggleGlobalVoice() {
      const btn = document.getElementById('g-voice');
      if (currentVoiceGender === 'male') {
        currentVoiceGender = 'female';
        btn.innerText = "👩 여성 음성";
      } else {
        currentVoiceGender = 'male';
        btn.innerText = "👨 남성 음성";
      }
    }

    function toggleGlobalSpeed() {
      const btn = document.getElementById('g-speed');
      if (currentRate === 0.85) {
        currentRate = 1.0;
        btn.innerText = "1.0x (표준)";
      } else if (currentRate === 1.0) {
        currentRate = 1.25;
        btn.innerText = "1.25x (빠름)";
      } else if (currentRate === 1.25) {
        currentRate = 0.75;
        btn.innerText = "0.75x (느림)";
      } else {
        currentRate = 0.85;
        btn.innerText = "0.85x (기본)";
      }
    }

    /* OLED 절전 암전 커튼 */
    let lastTap = 0;
    function openOledCurtain() {
      document.getElementById('dark-curtain').style.display = 'flex';
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }
    }
    function handleCurtainTap() {
      const now = Date.now();
      if (now - lastTap < 350) {
        document.getElementById('dark-curtain').style.display = 'none';
      }
      lastTap = now;
    }

    // 초기 실행
    renderCards();
  </script>

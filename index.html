<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실전 구동사 1,000회 무한 반복 플레이어</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 14px;
      padding-bottom: 90px;
      max-width: 780px;
      margin: 0 auto;
    }
    header { text-align: center; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    p.desc { font-size: 0.8rem; color: var(--text-sub); }

    /* 긴급 시스템 & 오디오 깨우기 바 */
    .audio-unlock-bar {
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .audio-unlock-bar span { font-size: 0.82rem; font-weight: 600; color: #bfdbfe; }
    .btn-unlock {
      background: #60a5fa;
      color: #0f172a;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 탭 메뉴 */
    .tab-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text-sub);
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* 컨트롤 헤더 */
    .global-controls {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .ctrl-group { display: flex; gap: 6px; align-items: center; }
    .btn-pill {
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-seq {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-emergency-stop {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* 문장 카드 */
    .card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    .card.playing { border-color: var(--accent); box-shadow: 0 0 10px rgba(56, 189, 248, 0.25); }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .verb-badge {
      background: #0284c7;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .loop-status {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--accent);
    }
    .ko-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .en-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 1.02rem;
      font-weight: 600;
      color: #38bdf8;
      line-height: 1.4;
      user-select: text;
    }
    .en-box.blind {
      filter: blur(5px);
      user-select: none;
      opacity: 0.4;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .btn-act {
      border: none;
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-blind-toggle { background: #475569; color: #fff; }
    .btn-play-1000 { background: var(--primary); color: #fff; }
    .btn-stop-card { background: #475569; color: #fff; }
    .btn-fav { background: transparent; border: 1px solid #475569; color: #94a3b8; }
    .btn-fav.active { background: #ca8a04; border-color: #ca8a04; color: #fff; }

    /* 화면끄기 절전 플로팅 버튼 */
    .floating-lock {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 10px 14px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* OLED 완벽 암전 화면 커튼 */
    #dark-curtain {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000;
      z-index: 99999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      user-select: none;
    }
    #dark-curtain .wake-hint {
      color: #334155;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }
    #dark-curtain .curr-text {
      color: #475569;
      font-size: 1.05rem;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    #dark-curtain .curr-count {
      color: #1e3a8a;
      font-size: 1.5rem;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔥 실전 구동사 1,000회 무한 루프</h1>
    <p class="desc">헬스·다이빙·펜션·카페 맞춤 예문 | 1,000회 연속 섀도잉 플레이어</p>
  </header>

  <!-- 오디오 사운드 언락 바 -->
  <div class="audio-unlock-bar">
    <span>🔊 소리가 안 나면 먼저 눌러주세요:</span>
    <button class="btn-unlock" onclick="forceUnlockAudio()">스피커 강제 깨우기</button>
  </div>

  <!-- 탭 메뉴 -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchCategory('daily')">🏋️ 일상·운동</button>
    <button class="tab-btn" onclick="switchCategory('pension')">🏡 펜션·손님</button>
    <button class="tab-btn" onclick="switchCategory('challenge')">🌊 다이빙·도전</button>
    <button class="tab-btn" onclick="switchCategory('review')">⭐ 복습함 (<span id="rev-cnt">0</span>)</button>
  </div>

  <!-- 상단 공용 컨트롤 -->
  <div class="global-controls">
    <div class="ctrl-group">
      <button class="btn-pill" id="g-voice" onclick="toggleGlobalVoice()">👨 남성 음성</button>
      <button class="btn-pill" id="g-speed" onclick="toggleGlobalSpeed()">0.85x (표준)</button>
    </div>
    <div class="ctrl-group">
      <button class="btn-seq" onclick="startSequentialPlay()">🔁 이 탭 전체 순차 반복</button>
      <button class="btn-emergency-stop" onclick="stopAllAudio()">⏹️ 정지</button>
    </div>
  </div>

  <!-- 문장 리스트 영역 -->
  <div id="cards-container"></div>

  <!-- 플로팅 OLED 절전 버튼 -->
  <button class="floating-lock" onclick="openOledCurtain()">
    🌙 화면 절전 (암전)
  </button>

  <!-- 완전 암전 절전 커튼 (더블 탭 해제) -->
  <div id="dark-curtain" onclick="handleCurtainTap()">
    <div class="wake-hint">화면을 빠르게 톡! 톡! 두 번 두드리면 복귀합니다</div>
    <div class="curr-text" id="curtain-text">대기 중...</div>
    <div class="curr-count" id="curtain-count">0 / 1000</div>
  </div>

  <script>
    // 1. 회원님 맞춤 라이프스타일 구동사 데이터베이스
    const phrasalDB = {
      daily: [
        { verb: "stick to", en: "I always stick to my low carb diet and workout routine.", ko: "나는 항상 저탄수 식단과 운동 루틴을 엄격히 고수해." },
        { verb: "work out", en: "I prefer to work out early in the morning before breakfast.", ko: "나는 아침 식사 전 이른 아침에 운동하는 걸 선호해." },
        { verb: "cut back on", en: "I decided to cut back on refined carbs to drop body fat.", ko: "체지방을 감량하기 위해 정제 탄수화물을 줄이기로 결심했어." },
        { verb: "wrap up", en: "Let's wrap up today's gym session with five sets of squats.", ko: "스쿼트 5세트로 오늘 헬스 세션을 슬슬 마무리하자." },
        { verb: "look forward to", en: "I always look forward to having an iced Americano after training.", ko: "운동 끝나고 시원한 아이스 아메리카노 한잔 마시는 시간을 항상 고대해." },
        { verb: "end up", en: "I ended up hitting personal records in deadlifts today.", ko: "오늘 결국 데드리프트에서 개인 신기록을 경신하게 되었어." }
      ],
      pension: [
        { verb: "check in", en: "Guests are supposed to check in between three and nine PM.", ko: "손님들은 오후 3시에서 9시 사이에 체크인하기로 되어 있습니다." },
        { verb: "look after", en: "I look after every corner of the pension to ensure cleanliness.", ko: "청결을 보장하기 위해 펜션의 구석구석을 꼼꼼하게 돌봅니다." },
        { verb: "take care of", en: "I will take care of the barbecue grill setup right now.", ko: "바비큐 그릴 세팅은 제가 지금 바로 챙겨드리겠습니다." },
        { verb: "deal with", en: "I have to deal with sudden schedule changes from visitors.", ko: "손님들의 갑작스러운 예약 일정 변경 건을 신속하게 처리해야 해." },
        { verb: "drop off", en: "Could you drop off the extra towels at room number three?", ko: "3호실에 여분의 수건 좀 전달해 주실 수 있나요?" },
        { verb: "show around", en: "Let me show you around the outdoor garden and facilities.", ko: "야외 정원과 편의시설 위치를 안내해 드리겠습니다." }
      ],
      challenge: [
        { verb: "warm up", en: "Make sure to warm up thoroughly before entering the deep pool.", ko: "잠수풀 깊은 물에 들어가기 전에 반드시 몸을 충분히 풀어줘." },
        { verb: "hang on", en: "Hang on for ten more seconds during your breath hold training.", ko: "숨 참기 훈련할 때 딱 10초만 더 버텨봐." },
        { verb: "pull off", en: "Although the dive was challenging, we managed to pull it off.", ko: "다이빙이 까다로웠음에도 불구하고 우리는 멋지게 해냈어." },
        { verb: "burn out", en: "Pace yourself so that you don't burn out too quickly in water.", ko: "물속에서 너무 일찍 지쳐 쓰러지지 않도록 체력을 잘 안배해." },
        { verb: "give up", en: "I am never going to give up until I reach a four minute breath hold.", ko: "4분 숨 참기를 달성할 때까지는 절대로 포기하지 않을 거야." },
        { verb: "figure out", en: "I need to figure out why my equalization fails below ten meters.", ko: "수심 10미터 아래에서 왜 이퀄라이징이 안 되는지 원인을 찾아내야 해." }
      ]
    };

    let curCat = 'daily';
    let reviewStore = JSON.parse(localStorage.getItem('phrasal_reviews') || '[]');
    let currentVoiceGender = 'male';
    let currentRate = 0.85;
    let isGlobalStopped = false;
    let activeLoopTimer = null;
    let currentLoopIndex = 0;
    const TARGET_REPEAT = 1000;

    // 2. [강력한 오디오 엔진] 하드웨어 사운드 채널 강제 언락
    function forceUnlockAudio() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.value = 0.01;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(0);
          osc.stop(0.05);
        }
      } catch(e) {}

      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      const testUtter = new SpeechSynthesisUtterance("Audio engine ready.");
      testUtter.lang = 'en-US';
      testUtter.rate = 1.0;
      testUtter.volume = 1.0;
      window.speechSynthesis.speak(testUtter);
      alert("🔊 브라우저 스피커가 강제 활성화되었습니다! 문장 버튼을 눌러보세요.");
    }

    // 3. 안정적인 원어민 보이스 매칭 함수
    function getSelectedVoice() {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      const usVoices = voices.filter(v => v.lang === 'en-US' || v.lang === 'en_US');
      const pool = usVoices.length > 0 ? usVoices : voices.filter(v => v.lang.startsWith('en'));

      if (currentVoiceGender === 'female') {
        return pool.find(v => /female|zira|jenny|samantha|susan|victoria/i.test(v.name)) || pool[0];
      } else {
        return pool.find(v => /male|david|guy|george/i.test(v.name)) || pool.find(v => !/female|zira|jenny/i.test(v.name)) || pool[0];
      }
    }
    window.speechSynthesis.onvoiceschanged = () => { getSelectedVoice(); };

    // 4. 발음 교정 필터
    function sanitizeForSpeech(text) {
      return text.replace(/freediving/gi, "free diving")
                 .replace(/Freediving/gi, "Free diving");
    }

    // 5. [핵심] 1,000회 단일 문장 무한 섀도잉 루프
    function play1000Times(enText, cardIdx) {
      stopAllAudio();
      isGlobalStopped = false;

      // 카드 하이라이트
      document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
      const activeCard = document.getElementById(`card-${cardIdx}`);
      if (activeCard) activeCard.classList.add('playing');

      const statusEl = document.getElementById(`status-${cardIdx}`);
      const curtainText = document.getElementById('curtain-text');
      const curtainCount = document.getElementById('curtain-count');

      curtainText.innerText = enText;
      let count = 0;
      const speechText = sanitizeForSpeech(enText);

      function runLoop() {
        if (isGlobalStopped || count >= TARGET_REPEAT) {
          if (statusEl && !isGlobalStopped) statusEl.innerText = "1,000회 완주!";
          return;
        }

        count++;
        if (statusEl) statusEl.innerText = `${count} / ${TARGET_REPEAT}`;
        curtainCount.innerText = `${count} / ${TARGET_REPEAT}`;

        // 브라우저 큐 비우고 재개
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const u = new SpeechSynthesisUtterance(speechText);
        u.lang = 'en-US';
        u.rate = currentRate;
        u.volume = 1.0;
        u.pitch = 1.0;

        const v = getSelectedVoice();
        if (v) u.voice = v;

        // GC 인스턴스 보호
        window._activeUtterance = u;

        u.onend = () => {
          if (!isGlobalStopped && count < TARGET_REPEAT) {
            // 따라 말할 수 있는 0.75초 정적 간격
            activeLoopTimer = setTimeout(runLoop, 750);
          }
        };

        u.onerror = (err) => {
          console.warn("TTS Error bypass:", err);
          if (!isGlobalStopped && count < TARGET_REPEAT) {
            activeLoopTimer = setTimeout(runLoop, 400);
          }
        };

        window.speechSynthesis.speak(u);
      }

      runLoop();
    }

    // 6. [전체 순차 반복 모드] 탭 내 모든 문장을 차례대로 무한 재생
    function startSequentialPlay() {
      stopAllAudio();
      isGlobalStopped = false;
      const list = getCurrentList();
      if (list.length === 0) return;

      let idx = 0;
      function playNextSentence() {
        if (isGlobalStopped) return;
        if (idx >= list.length) idx = 0; // 끝까지 가면 다시 처음부터

        const item = list[idx];
        const speechText = sanitizeForSpeech(item.en);

        document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
        const activeCard = document.getElementById(`card-${idx}`);
        if (activeCard) activeCard.classList.add('playing');

        const statusEl = document.getElementById(`status-${idx}`);
        if (statusEl) statusEl.innerText = "순차 재생 중...";

        document.getElementById('curtain-text').innerText = item.en;
        document.getElementById('curtain-count').innerText = `문장 ${idx + 1} / ${list.length}`;

        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const u = new SpeechSynthesisUtterance(speechText);
        u.lang = 'en-US';
        u.rate = currentRate;
        u.volume = 1.0;
        u.pitch = 1.0;
        const v = getSelectedVoice();
        if (v) u.voice = v;

        window._activeUtterance = u;

        u.onend = () => {
          if (!isGlobalStopped) {
            idx++;
            activeLoopTimer = setTimeout(playNextSentence, 900);
          }
        };

        u.onerror = () => {
          if (!isGlobalStopped) {
            idx++;
            activeLoopTimer = setTimeout(playNextSentence, 500);
          }
        };

        window.speechSynthesis.speak(u);
      }

      playNextSentence();
    }

    // 7. 긴급 즉시 정지
    function stopAllAudio() {
      isGlobalStopped = true;
      clearTimeout(activeLoopTimer);
      window.speechSynthesis.cancel();
      document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
      document.querySelectorAll('.loop-status').forEach(s => s.innerText = "");
    }

    // 8. 뷰 렌더링 및 UI 조작
    function getCurrentList() {
      return (curCat === 'review') ? reviewStore : phrasalDB[curCat];
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = "";
      const list = getCurrentList();

      document.getElementById('rev-cnt').innerText = reviewStore.length;

      if (list.length === 0 && curCat === 'review') {
        container.innerHTML = `<div style="text-align:center; padding:40px 10px; color:#64748b;">
          아직 복습함에 담긴 문장이 없습니다.<br>다른 탭에서 [⭐ 복습 담기]를 눌러보세요.
        </div>`;
        return;
      }

      list.forEach((item, idx) => {
        const isFav = reviewStore.some(r => r.en === item.en);
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${idx}`;
        card.innerHTML = `
          <div class="card-head">
            <span class="verb-badge">${item.verb}</span>
            <span class="loop-status" id="status-${idx}"></span>
          </div>
          <div class="ko-text">${item.ko}</div>
          <div class="en-box blind" id="en-${idx}">${item.en}</div>
          <div class="card-actions">
            <button class="btn-act btn-fav ${isFav ? 'active' : ''}" onclick="toggleReview(${idx})">${isFav ? '★ 복습 중' : '⭐ 복습 담기'}</button>
            <button class="btn-act btn-blind-toggle" onclick="toggleBlind(${idx})">👁️ 정답 보기</button>
            <button class="btn-act btn-play-1000" onclick="play1000Times('${item.en.replace(/'/g, "\\'")}', ${idx})">▶ 1000회 반복</button>
            <button class="btn-act btn-stop-card" onclick="stopAllAudio()">⏹️ 정지</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleBlind(idx) {
      const enEl = document.getElementById(`en-${idx}`);
      const btn = event.currentTarget;
      if (enEl.classList.contains('blind')) {
        enEl.classList.remove('blind');
        btn.innerText = "🙈 가리기";
      } else {
        enEl.classList.add('blind');
        btn.innerText = "👁️ 정답 보기";
      }
    }

    function toggleReview(idx) {
      const list = getCurrentList();
      const target = list[idx];
      const foundIdx = reviewStore.findIndex(r => r.en === target.en);

      if (foundIdx > -1) {
        reviewStore.splice(foundIdx, 1);
      } else {
        reviewStore.push(target);
      }
      localStorage.setItem('phrasal_reviews', JSON.stringify(reviewStore));
      renderCards();
    }

    function switchCategory(cat) {
      stopAllAudio();
      curCat = cat;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', ['daily', 'pension', 'challenge', 'review'][i] === cat);
      });
      renderCards();
    }

    function toggleGlobalVoice() {
      const btn = document.getElementById('g-voice');
      if (currentVoiceGender === 'male') {
        currentVoiceGender = 'female';
        btn.innerText = "👩 여성 음성";
      } else {
        currentVoiceGender = 'male';
        btn.innerText = "👨 남성 음성";
      }
    }

    function toggleGlobalSpeed() {
      const btn = document.getElementById('g-speed');
      if (currentRate === 0.85) {
        currentRate = 1.0;
        btn.innerText = "1.0x (보통)";
      } else if (currentRate === 1.0) {
        currentRate = 1.25;
        btn.innerText = "1.25x (빠름)";
      } else if (currentRate === 1.25) {
        currentRate = 0.75;
        btn.innerText = "0.75x (느림)";
      } else {
        currentRate = 0.85;
        btn.innerText = "0.85x (표준)";
      }
    }

    // 9. OLED 절전 암전 모드 (더블 탭 복귀)
    let lastTap = 0;
    function openOledCurtain() {
      document.getElementById('dark-curtain').style.display = 'flex';
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }
    }
    function handleCurtainTap() {
      const now = Date.now();
      if (now - lastTap < 350) {
        document.getElementById('dark-curtain').style.display = 'none';
      }
      lastTap = now;
    }

    // 초기 실행
    renderCards();
  </script>
</body>
</html>
